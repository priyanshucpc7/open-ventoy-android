plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "org.openventoy.android"
    compileSdk 34

    defaultConfig {
        applicationId "org.openventoy.android"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation "androidx.work:work-runtime-ktx:2.9.0"
    // USB mass storage via open library (added at build time, not vendored):
    // implementation "com.github.mjdev:libaums:0.9.4"
    // NOTE: no ads, no billing, no firebase, no sentry dependencies.
}
