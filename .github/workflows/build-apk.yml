name: Build debug APK (offline, ad-free)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.7
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
        working-directory: .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: open-ventoy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
